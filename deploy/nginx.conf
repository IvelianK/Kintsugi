server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # La demo no hace peticiones de red ni se incrusta en otras páginas: la CSP lo cierra todo
    # salvo sus propios ficheros y las imágenes data: (favicon y firma dibujada).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Sin caché larga: son cuatro ficheros sin huella en el nombre, así un despliegue
    # nunca mezcla un index.html nuevo con un app.js viejo. La revalidación usa ETag.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
