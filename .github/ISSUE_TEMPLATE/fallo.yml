name: Fallo
description: Algo de la demo, el despliegue o la documentación no funciona como dice
labels: [fallo]
body:
  - type: dropdown
    id: donde
    attributes:
      label: Dónde
      options: [Demo, Paquete de despliegue, Documentación]
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Abro la pestaña Calendario\n2. ..."
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas y qué ha pasado
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Navegador, sistema o versión de Docker
